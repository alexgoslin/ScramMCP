<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Demo Project - Scram</title>
<!--
  A stand-in for Scram's editor, for tests. It copies the parts Scram Desktop relies on, from RoboBuild's
  notes and from screenshots of the real editor (Nov 2026): the AI chat in a left column with a
  "Describe the problem you're trying to solve..." box and a Send control (aria-label="Send") that
  turns into an unlabelled square stop button while the bot works, with the box then saying
  "Add to queue...", collapsed "Thought" blocks, a "Review plan" card with "Read
  more" and "Approve plan", questions as option cards (a title over a description) plus a "Write
  my own answer" box and Cancel, which replace the chat box until answered, "Page Structure"
  under the chat, Edit / Run buttons at the top right (Run = preview=run in the address), and a
  Run preview iframe showing the app (app.html, from another address).
-->
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  #top { height: 40px; display: flex; gap: 16px; align-items: center; padding: 0 12px; border-bottom: 1px solid #ddd; }
  #top span { cursor: pointer; }
  #modes { margin-left: auto; display: flex; gap: 4px; }
  #modes button[aria-pressed="true"] { background: #dde; }
  #left { position: fixed; left: 0; top: 41px; bottom: 0; width: 340px; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
  #chat { display: flex; flex-direction: column; height: 70%; }
  #chat-title { padding: 6px 10px; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 8px; }
  .msg { margin: 6px 0; padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; }
  .user { background: #eef; }
  .bot { background: #f5f5f5; }
  #composer { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #ddd; align-items: flex-end; }
  #box { flex: 1; min-height: 40px; border: 1px solid #ccc; border-radius: 6px; padding: 6px; }
  #box:empty::before { content: attr(data-placeholder); color: #999; }
  #send { cursor: pointer; padding: 4px 8px; }
  .hidden { display: none !important; }
  #structure { padding: 8px; border-top: 1px solid #ddd; }
  #canvas { position: fixed; left: 350px; top: 50px; right: 10px; bottom: 10px; }
  #canvas iframe { width: 100%; height: calc(100% - 44px); border: 1px solid #ddd; display: block; margin: 0 auto; }
  #toolbar { height: 36px; display: flex; gap: 8px; align-items: center; justify-content: flex-end; position: relative; }
  #path { width: 220px; }
  #size-menu { position: absolute; right: 0; top: 36px; background: #fff; border: 1px solid #ccc; z-index: 5; display: flex; flex-direction: column; }
  body:not(.run) .run-only, body.run .edit-only { display: none !important; }
  #notice { position: absolute; top: 44px; left: 0; right: 0; background: #fff3cd; padding: 6px; z-index: 4; }
  #activity { position: fixed; top: 50px; right: 10px; width: 55%; bottom: 10px; background: #fff; border: 1px solid #ccc; z-index: 6; padding: 8px; }
  #consent { position: fixed; left: 0; bottom: 0; width: 360px; background: #222; color: #fff; padding: 12px; z-index: 20; }
  #chat-title button { width: 24px; height: 24px; padding: 0; }
  .plan-more { display: none; }
  .plan-more.open { display: block; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; margin: 6px 0; cursor: pointer; }
  .card .t { font-weight: 600; }
  #own { width: 95%; }
</style>
</head>
<body>
<div id="top"><b>Scram</b><span id="fe">Frontend 1</span><span>More</span><span>Publish</span>
  <div id="modes"><button id="edit-btn" aria-pressed="true">Edit</button><button id="run-btn" aria-pressed="false">Run</button></div>
</div>
<div id="left">
  <div id="chat">
    <div id="chat-title"><span id="chat-name">“New chat”</span> <button aria-label="Plans">☰</button><button aria-label="New chat">+</button><button aria-label="Chat history">⟲</button><button aria-label="Collapse">^</button></div>
    <div id="messages"></div>
    <div id="composer">
      <div id="box" contenteditable="true" role="textbox" aria-label="Describe the problem you're trying to solve..." data-placeholder="Describe the problem you're trying to solve..."></div>
      <button id="attach" aria-label="Attach files">📎</button>
      <span id="send" role="button" aria-label="Send">➤</span>
    </div>
  </div>
  <div id="structure"><div>Page Structure</div><div>Home Page</div></div>
</div>
<div id="canvas">
  <div id="toolbar">
    <button id="page-picker" class="edit-only" aria-label="Current page: Home Page. Open page list.">Home Page ▾</button>
    <button id="refresh" class="run-only" aria-label="Refresh">⟳</button>
    <input id="path" class="run-only" value="/" aria-label="Path">
    <button id="activity-btn" class="run-only" data-testid="dev-deployment-activity-btn" aria-label="Deployment activity">1</button>
    <button id="size-btn" aria-label="Preview size, Desktop">▭</button>
    <div id="size-menu" role="menu" class="hidden"><button role="menuitem" aria-label="Preview size, Desktop">Desktop</button><button role="menuitem" aria-label="Preview size, Tablet">Tablet</button><button role="menuitem" aria-label="Preview size, Mobile">Mobile</button></div>
  </div>
  <div id="notice" class="hidden">This version is outdated · Build pending</div>
  <iframe title="Running app" src="__APP_URL__"></iframe>
</div>
<aside id="activity" class="hidden"><div>Activity</div><button id="activity-close" aria-label="Close">✕</button><div>Deploying build 42…</div></aside>
<div id="consent" class="hidden">We use cookies to improve your experience. <button id="accept-all">Accept all</button> <button id="reject-all">Reject all</button></div>

<script>
  const messages = document.getElementById("messages");
  const box = document.getElementById("box");
  const send = document.getElementById("send");
  const composer = document.getElementById("composer");
  let stopped = false;
  window.sentMessages = [];

  // Edit / Run: Run mode is "preview=run" in the address.
  const runBtn = document.getElementById("run-btn");
  const editBtn = document.getElementById("edit-btn");
  function showMode() {
    const run = new URL(location.href).searchParams.get("preview") === "run";
    runBtn.setAttribute("aria-pressed", String(run));
    editBtn.setAttribute("aria-pressed", String(!run));
    document.body.classList.toggle("run", run);
  }

  // The Run-mode toolbar, like real Scram's: Refresh, the path box, the Activity badge, and the
  // preview-size menu (Desktop / Tablet / Mobile, also in the address as breakpoint=…).
  const APP = "__APP_URL__";
  const frame = document.querySelector("#canvas iframe");
  const pathBox = document.getElementById("path");
  const notice = document.getElementById("notice");
  const WIDTHS = { desktop: "100%", tablet: "768px", mobile: "375px" };
  pathBox.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    frame.src = APP + (pathBox.value === "/" ? "" : pathBox.value);
  });
  document.getElementById("refresh").addEventListener("click", () => {
    notice.classList.add("hidden");
    frame.src = frame.src;
  });
  const sizeBtn = document.getElementById("size-btn");
  const sizeMenu = document.getElementById("size-menu");
  sizeBtn.addEventListener("click", () => sizeMenu.classList.toggle("hidden"));
  for (const opt of sizeMenu.querySelectorAll("button")) {
    opt.addEventListener("click", () => {
      const size = opt.textContent.toLowerCase();
      const u = new URL(location.href);
      u.searchParams.set("breakpoint", size);
      history.replaceState(null, "", u.href);
      frame.style.width = WIDTHS[size];
      sizeBtn.setAttribute("aria-label", `Preview size, ${opt.textContent}`);
      sizeMenu.classList.add("hidden");
    });
  }
  const activity = document.getElementById("activity");
  document.getElementById("activity-btn").addEventListener("click", () => activity.classList.remove("hidden"));
  document.getElementById("activity-close").addEventListener("click", () => activity.classList.add("hidden"));
  const consent = document.getElementById("consent");
  document.getElementById("reject-all").addEventListener("click", () => ((window.consent = "rejected"), consent.classList.add("hidden")));
  document.getElementById("accept-all").addEventListener("click", () => ((window.consent = "accepted"), consent.classList.add("hidden")));
  // For the tests: things real Scram does by itself.
  window.makeOutdated = () => notice.classList.remove("hidden");
  window.openActivity = () => activity.classList.remove("hidden");
  window.showConsent = () => consent.classList.remove("hidden");
  window.fallBackToEdit = () => document.body.classList.remove("run"); // the address still says Run
  window.newChats = 0;
  document.querySelector('#chat-title [aria-label="New chat"]').addEventListener("click", () => {
    messages.innerHTML = "";
    window.newChats++;
  });
  function setMode(run) {
    const u = new URL(location.href);
    if (run) u.searchParams.set("preview", "run");
    else u.searchParams.delete("preview");
    history.replaceState(null, "", u.href);
    showMode();
  }
  runBtn.addEventListener("click", () => setMode(true));
  editBtn.addEventListener("click", () => setMode(false));
  showMode();

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function add(cls, text) {
    const el = document.createElement("div");
    el.className = `msg ${cls}`;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }
  // While the bot works, like real Scram: the send button becomes a square stop button with no
  // label, and the chat box says "Add to queue...".
  let working = false;
  const IDLE_HINT = "Describe the problem you're trying to solve...";
  function setWorking(on) {
    working = on;
    const hint = on ? "Add to queue..." : IDLE_HINT;
    box.setAttribute("aria-label", hint);
    box.dataset.placeholder = hint;
    if (on) {
      send.removeAttribute("aria-label");
      send.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14"><rect width="14" height="14" rx="2"/></svg>';
    } else {
      send.setAttribute("aria-label", "Send");
      send.textContent = "➤";
    }
  }
  // The bot "streams" its reply word by word, after a hidden Thought block.
  async function botSays(text, { thinkMs = 600 } = {}) {
    stopped = false;
    setWorking(true);
    const thought = document.createElement("details");
    thought.className = "msg bot thinking";
    thought.innerHTML = "<summary>Thought for 2s</summary><div>Internal reasoning that the person never reads: considering the layout of the pricing table carefully.</div>";
    messages.appendChild(thought);
    await sleep(thinkMs);
    const el = add("bot", "");
    for (const word of text.split(" ")) {
      if (stopped) break;
      el.textContent += (el.textContent ? " " : "") + word;
      messages.scrollTop = messages.scrollHeight;
      await sleep(40);
    }
    setWorking(false);
    return el;
  }

  // A question like real Scram's: option cards, a "Write my own answer" box (Enter sends) and
  // Cancel, in place of the chat box until it's answered.
  const SCOPE_OPTIONS = [
    ["Help me scope it out", "We talk through who it's for, the key screens, the data, and the look before anything gets built."],
    ["Just start building", "I make all the design and feature decisions and build the whole thing properly."],
  ];
  function ask(question = "Would you like to scope out the app first, or just start building?", options = SCOPE_OPTIONS) {
    const q = document.createElement("div");
    q.className = "msg bot question";
    q.innerHTML = `<div>${question}</div>
      ${options.map(([t, d]) => `<div class="card"><div class="t">${t}</div><div>${d}</div></div>`).join("\n      ")}
      <textarea id="own" placeholder="Write my own answer"></textarea>
      <button type="button" id="cancel-q">Cancel</button>`;
    messages.appendChild(q);
    composer.classList.add("hidden");
    const answered = async (answer) => {
      q.querySelectorAll(".card, textarea, button").forEach((el) => el.remove());
      composer.classList.remove("hidden");
      add("user", answer);
      await botSays(`Great, I'll go with: ${answer}.`);
    };
    q.querySelectorAll(".card").forEach((card) => card.addEventListener("click", () => answered(card.querySelector(".t").textContent)));
    q.querySelector("#own").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && e.target.value.trim()) {
        e.preventDefault();
        answered(e.target.value.trim());
      }
    });
    q.querySelector("#cancel-q").addEventListener("click", () => {
      q.remove();
      composer.classList.remove("hidden");
    });
  }

  async function submit() {
    const text = box.innerText.trim();
    if (!text) return;
    window.sentMessages.push(text);
    add("user", text);
    box.textContent = "";
    if (/testing question/i.test(text)) {
      // Like real Scram after a rebuild: it offers to open Run itself (it can't).
      await botSays("Built. How should I test it?");
      ask("How should I test it?", [
        ["Open Run and test it for me", "I'll switch to Run mode and click through it."],
        ["I'll open Run myself · go ahead when it's up", "Test as soon as Run is on."],
      ]);
    } else if (/forgetful/i.test(text) && !window.forgotOnce) {
      // Like real Scram after its memory is compressed: it can't re-open the attached step.
      window.forgotOnce = true;
      await botSays("Which items are still left? I can't re-open the attachment from earlier.");
    } else if (/take payments/i.test(text)) {
      await botSays("To take payments I need your Stripe secret API key. Please add it in Settings, then tell me to continue.");
    } else if (/header question/i.test(text)) {
      await botSays("I have a question about the header.");
      ask("What should happen to the old header?", [
        ["Remove the old header", "Take the old header off every page and use the new one."],
        ["Publish it now", "Put the app live for everyone with the new header."],
      ]);
    } else if (/question/i.test(text)) {
      await botSays("I have a question before I start.");
      ask();
    } else if (/plan/i.test(text)) {
      const el = await botSays("Here is my plan for the pricing page.");
      const card = document.createElement("div");
      card.className = "msg bot plan";
      card.innerHTML = '<div>Review plan</div><b>Plan: Pricing page</b><div class="plan-more">1. Add a Pricing page. 2. Add a three-tier pricing table.</div><button type="button" class="read-more">Read more</button><div>To request changes, describe them in the message box below, then send.</div><button type="button" class="approve">Approve plan</button>';
      card.querySelector(".read-more").onclick = () => card.querySelector(".plan-more").classList.add("open");
      card.querySelector(".approve").onclick = async () => {
        card.querySelector(".approve").remove();
        await botSays("Building it now. Done! I added the Pricing page with a three-tier table.", { thinkMs: 1500 });
      };
      el.after(card);
    } else if (/slow/i.test(text)) {
      await botSays("Working on it. " + "step ".repeat(150) + "All done.");
    } else {
      await botSays(`You said ${text.length} characters. I updated the app.`);
    }
  }

  send.addEventListener("click", () => (working ? (stopped = true) : submit()));
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });
</script>
</body>
</html>
