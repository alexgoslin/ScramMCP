# Builds the Scram MCP installers on real Windows and Mac machines, and puts them on the repo's
# Releases page:
#   - push a version tag (e.g. v0.2.0): it creates the release with the installers, or
#   - publish a release on GitHub's website (Releases → Draft a new release → a new v… tag):
#     it adds the installers to that release.
#   - or run it by hand from the Actions tab with "publish" ticked: it creates the release for
#     the version in package.json (v0.2.0 etc.) itself.
# Run by hand without "publish", it only keeps the installers as downloadable build artifacts.
# The packaging settings are in installer/electron-builder.yml; see installer/README.md.

name: Installers

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (v + the version in package.json) with the installers"
        type: boolean
        default: false

permissions:
  contents: write # to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: installer/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: installer/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate yet
      # Install it the way a user would and run the end-to-end test on the installed app.
      # If that fails, nothing is uploaded or published.
      - name: Install and test the app
        shell: bash
        run: bash installer/test-packaged.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # Each installer goes onto the release as soon as it's built (Mac machines can take a
      # while to free up; the Windows installer shouldn't wait for them).
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The other build may create it at the same moment: then just upload to theirs.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Scram MCP $TAG" --notes-file installer/RELEASE_NOTES.md || sleep 5
          fi
          gh release upload "$TAG" ${{ matrix.files }} --clobber
          # Made on the website with no description: add the install notes.
          if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
            gh release edit "$TAG" --notes-file installer/RELEASE_NOTES.md
          fi
