# Builds the Scram MCP installers on real Windows and Mac machines, and publishes them on the
# repo's Releases page when a version tag is pushed (e.g. v0.2.0). Can also be run by hand from
# the Actions tab (it then only keeps the installers as downloadable build artifacts).
# The packaging settings are in installer/electron-builder.yml; see installer/README.md.

name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: installer/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: installer/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate yet
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Scram MCP $GITHUB_REF_NAME" --notes-file installer/RELEASE_NOTES.md
