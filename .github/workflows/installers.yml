# Builds the Scram MCP installers on real Windows and Mac machines, and puts them on the repo's
# Releases page:
#   - push a version tag (e.g. v0.2.0): it creates the release with the installers, or
#   - publish a release on GitHub's website (Releases → Draft a new release → a new v… tag):
#     it adds the installers to that release.
#   - or run it by hand from the Actions tab with "publish" ticked: it creates the release for
#     the version in package.json (v0.2.0 etc.) itself.
# Run by hand without "publish", it only keeps the installers as downloadable build artifacts.
# The packaging settings are in installer/electron-builder.yml; see installer/README.md.

name: Installers

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (v + the version in package.json) with the installers"
        type: boolean
        default: false

permissions:
  contents: write # to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: installer/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: installer/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate yet
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Made on the website: add the installers, and the install notes if it has none.
            gh release upload "$TAG" out/* --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file installer/RELEASE_NOTES.md
            fi
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Scram MCP $TAG" --notes-file installer/RELEASE_NOTES.md
          fi
